<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NLGEP AI</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:#000;font-family:Arial,sans-serif}
body{display:flex;justify-content:center;padding:40px 16px}.app{width:min(760px,100%)}
h1{margin:0 0 4px;font-size:28px}.sub{margin-bottom:24px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}select,button,textarea{font:16px Arial,sans-serif;color:#000;background:#fff;border:1px solid #000;border-radius:2px}
select,button{padding:9px 12px}button{cursor:pointer}.check{display:flex;align-items:center;gap:6px}
textarea{width:100%;min-height:140px;padding:12px;resize:vertical;outline:none}textarea:focus,select:focus,button:focus{outline:2px solid #000;outline-offset:1px}
.send{margin-top:8px;width:100%}.status{margin-top:12px;min-height:22px}.answer{white-space:pre-wrap;border:1px solid #000;padding:14px;margin-top:12px;min-height:100px}.sources{margin-top:12px}.sources a{display:block;color:#000;margin:5px 0}
</style>
</head>
<body>
<main class="app">
<h1>NLGEP AI</h1><div class="sub">Choose a model and ask a question.</div>
<div class="controls"><select id="model" aria-label="Model"></select><label class="check"><input type="checkbox" id="web"> Tavily web search</label></div>
<textarea id="prompt" placeholder="Ask anything..."></textarea><button class="send" id="send">Send</button>
<div class="status" id="status"></div><div class="answer" id="answer" hidden></div><div class="sources" id="sources"></div>
<script>
const model=document.getElementById('model'),web=document.getElementById('web'),prompt=document.getElementById('prompt'),send=document.getElementById('send'),status=document.getElementById('status'),answer=document.getElementById('answer'),sources=document.getElementById('sources');
async function load(){const r=await fetch('/api/config',{cache:'no-store'});const c=await r.json();model.innerHTML='';c.models.forEach(m=>{const o=document.createElement('option');o.value=m.id;o.textContent=m.label+(m.configured?'':' (not configured)');model.appendChild(o)});web.disabled=!c.tavily;if(!c.tavily)web.checked=false}
async function ask(){const p=prompt.value.trim();if(!p)return;send.disabled=true;status.textContent='Thinking...';answer.hidden=true;sources.innerHTML='';try{const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:model.value,prompt:p,web:web.checked})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'Request failed');answer.textContent=d.answer;answer.hidden=false;d.sources.forEach(s=>{const a=document.createElement('a');a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=s.title;sources.appendChild(a)});status.textContent=''}catch(e){status.textContent='Error: '+e.message}finally{send.disabled=false}}
send.onclick=ask;prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();ask()}});load().catch(e=>status.textContent='Error loading configuration: '+e.message);prompt.focus();
</script>
</main>
</body></html>
