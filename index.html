<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Render AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070909;color:#eaffea;font:15px Arial,sans-serif}main{width:min(980px,94%);margin:36px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-size:30px;font-weight:800}.sub{color:#91a591;margin:5px 0 24px}.panel{background:#101513;border:1px solid #263329;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 10px 30px #0005}.label{font-size:12px;color:#8fa28f;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}.models{display:flex;gap:8px;flex-wrap:wrap}.model,.mode,.send,.chat-send{border:1px solid #334537;background:#151c17;color:#dfffe2;border-radius:9px;padding:10px 13px;cursor:pointer}.model.active,.mode.active{border-color:#32ff68;box-shadow:0 0 14px #32ff6830}.model:disabled,.mode:disabled{opacity:.4;cursor:not-allowed}textarea,input{width:100%;background:#0b0f0c;color:#effff0;border:1px solid #304034;border-radius:10px;padding:13px;outline:none}textarea{min-height:150px;resize:vertical}textarea:focus,input:focus{border-color:#32ff68}.actions{display:flex;gap:8px;margin-top:9px}.send,.chat-send{flex:1;background:#18b84b;border-color:#18b84b;color:#041006;font-weight:800}.send:disabled,.chat-send:disabled{opacity:.5}.status{min-height:22px;color:#a9b9aa;margin:9px 2px}.answer{white-space:pre-wrap;line-height:1.55;background:#0b100d;border:1px solid #26372a;border-radius:10px;padding:15px;margin-top:10px}.sources a{display:block;color:#75ff9a;margin:7px 0}.quota{font-size:12px;color:#9fb0a0}.pill{display:inline-block;border:1px solid #304236;border-radius:999px;padding:4px 8px;margin:3px}.err{color:#ff8d8d}.chat-list{height:300px;overflow:auto;background:#0b100d;border:1px solid #26372a;border-radius:10px;padding:10px;margin:10px 0}.msg{padding:7px 4px;border-bottom:1px solid #1d281f}.msg b{color:#75ff9a}.msg small{color:#6f7e70;margin-left:7px}.chat-row{display:flex;gap:8px}.chat-row input{flex:1}.chat-help{color:#819181;font-size:12px;margin-top:7px}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.actions,.chat-row{flex-direction:column}}
</style></head>
<body><main>
<div class="top"><div><div class="brand">Render AI</div><div class="sub">Choose a model before you chat. Search and reasoning modes are optional.</div></div><div id="quota" class="quota">Loading usage…</div></div>

<section class="panel"><div class="label">Model — required</div><div id="models" class="models"></div></section>
<section class="panel"><div class="label">Mode</div><div class="models"><button class="mode active" data-mode="chat">Chat</button><button class="mode" data-mode="fast-search">Fast Search</button><button class="mode" data-mode="deep-search">Deep Search</button><button class="mode" data-mode="code">Write Code</button><button class="mode" data-mode="deep-think">Deep Think</button></div></section>
<section class="panel"><textarea id="prompt" placeholder="Choose a model, then ask anything…"></textarea><div class="actions"><button id="send" class="send" disabled>Send</button></div><div id="status" class="status"></div><div id="answer" class="answer" hidden></div><div id="sources" class="sources"></div></section>

<section class="panel">
<div class="label">Community Chat</div>
<div id="chatLogin"><div class="chat-row"><input id="username" maxlength="32" placeholder="Choose a username"><button id="login" class="chat-send">Join Chat</button></div><div class="chat-help">Your username is stored in Supabase. No password is required for this community chat.</div></div>
<div id="chatArea" hidden><div id="chatWho" class="chat-help"></div><div id="chatList" class="chat-list"></div><div class="chat-row"><input id="chatInput" maxlength="2000" placeholder="Message the community…"><button id="chatSend" class="chat-send">Send</button></div></div>
<div id="chatStatus" class="status"></div>
</section>

<script>
const modelsEl=document.getElementById('models'),prompt=document.getElementById('prompt'),send=document.getElementById('send'),status=document.getElementById('status'),answer=document.getElementById('answer'),sources=document.getElementById('sources'),quota=document.getElementById('quota');
const username=document.getElementById('username'),login=document.getElementById('login'),chatLogin=document.getElementById('chatLogin'),chatArea=document.getElementById('chatArea'),chatWho=document.getElementById('chatWho'),chatList=document.getElementById('chatList'),chatInput=document.getElementById('chatInput'),chatSend=document.getElementById('chatSend'),chatStatus=document.getElementById('chatStatus');
let selected='',mode='chat',config=null,chatReady=false,history=JSON.parse(localStorage.getItem('render-ai-history')||'[]');

function saveHistory(){history=history.slice(-12);localStorage.setItem('render-ai-history',JSON.stringify(history))}
function updateSend(){send.disabled=!selected||!prompt.value.trim()}
function renderModels(){modelsEl.innerHTML='';config.models.forEach(m=>{const b=document.createElement('button');b.className='model';b.textContent=m.label+(m.configured?'':' (not configured)');b.disabled=!m.configured;b.onclick=()=>{selected=m.id;document.querySelectorAll('.model').forEach(x=>x.classList.remove('active'));b.classList.add('active');updateSend()};modelsEl.appendChild(b)})}
function renderModes(){document.querySelectorAll('.mode').forEach(b=>{const unavailable=(b.dataset.mode==='fast-search'&&!config.features.fast_search)||(b.dataset.mode==='deep-search'&&!config.features.deep_search)||(b.dataset.mode==='code'&&!config.features.code);b.disabled=unavailable;b.classList.toggle('active',b.dataset.mode===mode);b.onclick=()=>{if(b.disabled)return;mode=b.dataset.mode;renderModes()}})}
async function loadUsage(){try{const r=await fetch('/api/usage',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();const parts=[];for(const [p,v] of Object.entries(d.providers)){parts.push('<span class="pill">'+p+': '+Math.max(0,v.user_remaining)+' left</span>')}quota.innerHTML=parts.join('')}catch(e){quota.textContent='Usage unavailable'}}
async function load(){const r=await fetch('/api/config',{cache:'no-store'});if(!r.ok)throw Error('Could not load configuration');config=await r.json();renderModels();renderModes();await loadUsage();await loadChat()}

function clearAnswer(){answer.hidden=false;answer.textContent='';sources.innerHTML=''}
function addSource(s){if(!s.url)return;const a=document.createElement('a');a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=s.title||s.url;sources.appendChild(a)}
async function ask(){
 const p=prompt.value.trim();if(!selected||!p)return;
 send.disabled=true;status.textContent='Working…';status.className='status';clearAnswer();
 const requestHistory=history.slice(-12);
 history.push({role:'user',content:p});saveHistory();
 try{
   const r=await fetch('/api/ask/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:selected,prompt:p,mode,history:requestHistory})});
   if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.detail||'Request failed')}
   const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='',full='';
   while(true){
     const {value,done}=await reader.read();if(done)break;
     buffer+=decoder.decode(value,{stream:true});
     const events=buffer.split('\n\n');buffer=events.pop()||'';
     for(const event of events){
       for(const line of event.split('\n')){
         if(!line.startsWith('data: '))continue;
         const raw=line.slice(6);if(raw==='[DONE]')continue;
         let d;try{d=JSON.parse(raw)}catch(e){continue}
         if(d.type==='token'){full+=d.text;answer.textContent=full;answer.hidden=false}
         if(d.type==='fallback'){full=d.text||'';answer.textContent=full;answer.hidden=false;(d.sources||[]).forEach(addSource)}
         if(d.type==='done'){(d.sources||[]).forEach(addSource);status.textContent=d.provider?'Used '+d.provider:''}
         if(d.type==='error')throw Error(d.error||'AI request failed')
       }
     }
   }
   if(full.trim()){history.push({role:'assistant',content:full});saveHistory()}
   await loadUsage();
 }catch(e){
   history=requestHistory;saveHistory();status.textContent='Error: '+e.message;status.className='status err'
 }finally{updateSend()}
}

function renderMessages(messages){chatList.innerHTML='';if(!messages.length){chatList.textContent='No messages yet. Be the first!';return}messages.forEach(m=>{const row=document.createElement('div');row.className='msg';const b=document.createElement('b');b.textContent=m.username;const small=document.createElement('small');small.textContent=new Date(m.created_at).toLocaleTimeString();const text=document.createElement('div');text.textContent=m.content;row.append(b,small,text);chatList.appendChild(row)});chatList.scrollTop=chatList.scrollHeight}
async function loadChat(){try{const r=await fetch('/api/chat/me',{cache:'no-store'});if(!r.ok)return;const d=await r.json();chatReady=true;chatLogin.hidden=true;chatArea.hidden=false;chatWho.textContent='Signed in as '+d.username;await refreshChat()}catch(e){}}
async function refreshChat(){if(!chatReady)return;try{const r=await fetch('/api/chat/messages',{cache:'no-store'});if(!r.ok){chatReady=false;return}const d=await r.json();renderMessages(d.messages||[])}catch(e){}}
async function joinChat(){const name=username.value.trim();if(!name)return;login.disabled=true;chatStatus.textContent='Joining…';try{const r=await fetch('/api/chat/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:name})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Could not join chat');chatReady=true;chatLogin.hidden=true;chatArea.hidden=false;chatWho.textContent='Signed in as '+d.username;chatStatus.textContent='';await refreshChat();chatInput.focus()}catch(e){chatStatus.textContent='Error: '+e.message;chatStatus.className='status err'}finally{login.disabled=false}}
async function sendChat(){const text=chatInput.value.trim();if(!chatReady||!text)return;chatSend.disabled=true;try{const r=await fetch('/api/chat/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:text})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Could not send message');chatInput.value='';await refreshChat()}catch(e){chatStatus.textContent='Error: '+e.message;chatStatus.className='status err'}finally{chatSend.disabled=false;chatInput.focus()}}
prompt.addEventListener('input',updateSend);prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();ask()}});
send.onclick=ask;login.onclick=joinChat;chatSend.onclick=sendChat;username.addEventListener('keydown',e=>{if(e.key==='Enter')joinChat()});chatInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});
setInterval(refreshChat,3000);load().catch(e=>{status.textContent='Error loading configuration: '+e.message;status.className='status err'});prompt.focus();
</script></main></body></html>
