services:
  - type: web
    name: nlgep-ai-minimal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # xKiro key: set the value in the Render dashboard (Environment tab). Never commit it.
      - key: XKIRO_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: UPSTASH_BLOB_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_SECRET_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: XKIRO_BASE_URL
        value: https://api.xkiro.com/v1
      # App-wide provider safety caps (below the current published free/API allowances)
      - key: GROQ_DAILY_LIMIT
        value: "900"
      - key: GROQ_MONTHLY_LIMIT
        value: "27000"
      - key: GEMINI_DAILY_LIMIT
        value: "18"
      - key: GEMINI_MONTHLY_LIMIT
        value: "540"
      - key: OPENROUTER_DAILY_LIMIT
        value: "45"
      - key: OPENROUTER_MONTHLY_LIMIT
        value: "1350"
      - key: XKIRO_DAILY_LIMIT
        value: "200"
      - key: XKIRO_MONTHLY_LIMIT
        value: "6000"
      - key: TAVILY_DAILY_LIMIT
        value: "100"
      - key: TAVILY_MONTHLY_LIMIT
        value: "1000"
      - key: EXA_DAILY_LIMIT
        value: "20"
      - key: EXA_MONTHLY_LIMIT
        value: "600"
      - key: PYTHON_VERSION
        value: 3.12.3

      - key: CLOUDFLARE_DAILY_LIMIT
        value: "90"
      - key: CLOUDFLARE_MONTHLY_LIMIT
        value: "2700"
      - key: CLOUDFLARE_IMAGE_MODEL
        value: "@cf/black-forest-labs/flux-2-klein-4b"
      - key: GROQ_USER_DAILY_LIMIT
        value: "10"
      - key: GROQ_USER_PER_MINUTE_LIMIT
        value: "3"
      - key: GEMINI_USER_DAILY_LIMIT
        value: "4"
      - key: GEMINI_USER_PER_MINUTE_LIMIT
        value: "2"
      - key: OPENROUTER_USER_DAILY_LIMIT
        value: "10"
      - key: OPENROUTER_USER_PER_MINUTE_LIMIT
        value: "3"
      - key: XKIRO_USER_DAILY_LIMIT
        value: "15"
      - key: XKIRO_USER_PER_MINUTE_LIMIT
        value: "3"
      - key: TAVILY_USER_DAILY_LIMIT
        value: "5"
      - key: TAVILY_USER_PER_MINUTE_LIMIT
        value: "2"
      - key: EXA_USER_DAILY_LIMIT
        value: "3"
      - key: EXA_USER_PER_MINUTE_LIMIT
        value: "1"
      - key: CLOUDFLARE_USER_DAILY_LIMIT
        value: "3"
      - key: CLOUDFLARE_USER_PER_MINUTE_LIMIT
        value: "1"
      - key: BLOB_MAX_FILE_SIZE
        value: "26214400"
